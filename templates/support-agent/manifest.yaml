# RU support-agent scaffold. The id and the model below are the starter
# placeholders every AHDE template ships with: run `ahde` in this directory and
# the first-run dialog asks which model the agent should use, then writes this
# file for you through a reviewed commit. The judge, when a case needs one, is
# asked the same way. Nothing here has to be edited by hand.
id: my-agent
model:
  # The Target's own model. Small, cheap models work here — the template's
  # instructions are written to survive one.
  provider: openai-compatible
  id: replace-with-model-id
  api: openai-completions
  baseUrl: http://127.0.0.1:1234/v1
  apiKeyEnv: AHDE_MODEL_API_KEY
  thinkingLevel: "off"
  timeoutMs: 300000
execution:
  # `bash` is what lets the agent call bin/<tool>. Drop it only if the agent
  # answers from instructions alone.
  tools: [read, bash]
  environmentAllowlist: []
  network: deny
  sandbox: best-effort
instructions:
  agentsMd: AGENTS.md
skills: []
tools: [tools/check_account.tool.yaml]
evalSuite:
  # No `judge:` block on purpose: no case here uses a `judge` grader yet. The
  # Builder asks for one through the same reviewed setup the moment it writes a
  # case that needs it.
  id: my-agent-development
  dataset: evals/development.jsonl
  graders: evals/graders.yaml
