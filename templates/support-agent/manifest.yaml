# RU support-agent template. Replace every REPLACE-ME before the first run.
# `ahde validate --target .` tells you what is still missing.
id: support-agent
model:
  # The Target's own model. Small, cheap models work here — the template's
  # instructions are written to survive one.
  provider: REPLACE-ME-provider          # e.g. openrouter
  id: REPLACE-ME-model-id                # e.g. vendor/model-9b
  api: openai-completions
  baseUrl: https://REPLACE-ME/api/v1
  apiKeyEnv: REPLACE_ME_API_KEY          # name of the env var, never the key
  thinkingLevel: "low"
  timeoutMs: 600000
execution:
  # `bash` is what lets the agent call bin/<tool>. Drop it only if the agent
  # answers from instructions alone.
  tools: [read, bash]
  environmentAllowlist: []
  network: deny
  sandbox: best-effort
instructions:
  agentsMd: AGENTS.md
skills: []
tools: [tools/check_account.tool.yaml]
evalSuite:
  id: support-agent-development
  dataset: evals/development.jsonl
  graders: evals/graders.yaml
  judge:
    # The judge must not be the Target's own model. Leave this block out
    # entirely if no case uses a `judge` grader.
    provider: REPLACE-ME-provider
    id: REPLACE-ME-judge-model-id
    api: openai-completions
    baseUrl: https://REPLACE-ME/api/v1
    apiKeyEnv: REPLACE_ME_API_KEY
    thinkingLevel: "high"
    timeoutMs: 600000
